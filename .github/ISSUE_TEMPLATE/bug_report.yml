name: Bug Report
description: File a bug report for any of the modern web apps
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue!
  - type: input
    id: app
    attributes:
      label: Affected Application
      description: e.g. Tinder Clone, TikTok Clone, Exercise Tracker, or Hono API
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear description of the problem
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Navigate to '/tracker'
        2. Click 'Log Workout'
        3. ...
    validations:
      required: true
